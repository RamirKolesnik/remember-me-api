name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

      - name: Smoke test without payments
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          PORT: "8080"
        run: |
          node src/server.ts > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf "localhost:8080/price?x=520&y=498" | grep -q '"priceCents":2900'
          curl -sf "localhost:8080/price?x=400&y=400&size=1" | grep -q '"priceUsd":2.99'
          # Only the center (wave 1) is open at launch
          curl -sf "localhost:8080/price?x=10&y=10" | grep -q '"error":"zone_closed"'
          curl -sf "localhost:8080/wall/pricing" | grep -q '"foundersLeft":1000'
          curl -sf "localhost:8080/wall/pricing" | grep -q '"milestones":{"firstWaveLast":null'
          curl -sf "localhost:8080/price?x=500&y=500" | grep -q '"error":"heart_not_for_sale"'
          curl -sf "localhost:8080/wall/stats" | grep -q '"cellsLeft":1004004'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/reservations -H 'content-type: application/json' -d '{"x":10,"y":10,"size":1,"name":"Ci"}')" = "503"
          kill "$(cat server.pid)"

      - name: Smoke test of a sandbox purchase
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sandbox
          PORT: "8081"
          PAYMENT_PROVIDER: sandbox
          API_PUBLIC_URL: http://localhost:8081
          FRONTEND_URL: https://example.test/site
        run: |
          set -e
          psql postgres://postgres:postgres@localhost:5432/postgres -c 'create database sandbox'
          node src/server.ts > sandbox.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8081/health && break; sleep 1; done
          before=$(curl -sf localhost:8081/wall/stats | node -pe 'JSON.parse(require("fs").readFileSync(0)).frames')
          test "$before" -eq 0  # no demo frames: the wall starts empty
          # Upload a 1x1 PNG
          png='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=='
          key=$(curl -sf -X POST localhost:8081/photos -H 'content-type: application/json' -d "{\"dataUrl\":\"$png\"}" | node -pe 'JSON.parse(require("fs").readFileSync(0)).photoKey')
          curl -sf "localhost:8081/photos/$key" -o /dev/null
          res=$(curl -sf -X POST localhost:8081/reservations -H 'content-type: application/json' \
            -d "{\"x\":400,\"y\":400,\"name\":\"Ci Buyer\",\"note\":\"hi @ci\",\"photoKey\":\"$key\"}")
          echo "$res"
          id=$(echo "$res" | node -pe 'JSON.parse(require("fs").readFileSync(0)).id')
          echo "$res" | grep -q '"priceCents":299'
          # Outer rings are not on sale yet
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8081/reservations -H 'content-type: application/json' -d '{"x":10,"y":10,"name":"Early"}')" = "422"
          # Only 1x1 frames are sold
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8081/reservations -H 'content-type: application/json' -d '{"x":40,"y":40,"size":2,"name":"Big"}')" = "400"
          # Same client, second hold: refused and pointed back to the first
          curl -s -X POST localhost:8081/reservations -H 'content-type: application/json' \
            -d '{"x":410,"y":410,"size":1,"name":"Again"}' | grep -q "sandbox/checkout/$id"
          curl -sf "localhost:8081/sandbox/checkout/$id" | grep -q 'TEST PAYMENT'
          loc=$(curl -s -o /dev/null -w '%{redirect_url}' -X POST "localhost:8081/sandbox/checkout/$id/pay" -H 'content-type: application/x-www-form-urlencoded')
          test "$loc" = "https://example.test/site/immortalize/done?id=$id&status=paid"
          curl -sf "localhost:8081/frames/$id" | grep -q '"name":"Ci Buyer"'
          # The paid frame has a number and a 9:16 story card
          curl -sf "localhost:8081/frames/$id" | grep -q '"number":[0-9]'
          num=$(curl -sf "localhost:8081/frames/$id" | sed -E 's/.*"number":([0-9]+).*/\1/')
          curl -sf "localhost:8081/frames/by-number/$num" | grep -q "\"id\":$id,"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8081/frames/by-number/999999)" = "404"
          # The newest frame leads the "Just immortalized" feed
          curl -sf "localhost:8081/wall/recent?limit=3" | node -e 'const b=JSON.parse(require("fs").readFileSync(0));if(b.frames.length!==1||b.frames[0].id!=='"$id"')process.exit(1)'
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:8081/wall/recent?limit=500')" = "400"
          curl -sf "localhost:8081/frames/$id" | grep -q "\"storyUrl\":\"http://localhost:8081/frames/$id/story.jpg\""
          curl -sf "localhost:8081/frames/$id/story.jpg" -o story.jpg
          test "$(head -c 3 story.jpg | od -An -tx1 | tr -d ' ')" = "ffd8ff"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8081/frames/999999/story.jpg)" = "404"
          curl -sf localhost:8081/wall/pricing | grep -q '"foundersLeft":999'
          # The first frame on the wall is the first in its zone.
          curl -sf localhost:8081/wall/pricing | grep -q "\"first\":$num"
          after=$(curl -sf localhost:8081/wall/stats | node -pe 'JSON.parse(require("fs").readFileSync(0)).frames')
          test "$after" -eq $((before + 1))
          # Cancel frees the spot
          res2=$(curl -sf -X POST localhost:8081/reservations -H 'content-type: application/json' -d '{"x":420,"y":420,"size":1,"name":"Quitter"}')
          id2=$(echo "$res2" | node -pe 'JSON.parse(require("fs").readFileSync(0)).id')
          curl -s -o /dev/null -X POST "localhost:8081/sandbox/checkout/$id2/cancel" -H 'content-type: application/x-www-form-urlencoded'
          curl -sf -X POST localhost:8081/reservations -H 'content-type: application/json' -d '{"x":420,"y":420,"size":1,"name":"Next"}' | grep -q checkoutUrl

      - name: Server logs
        if: failure()
        run: cat server.log sandbox.log 2>/dev/null || true

      - name: Docker image builds
        run: docker build -t remember-me-api .

  # Every green push to main redeploys the test API on Render.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: render-deploy
      cancel-in-progress: true
    steps:
      - name: Trigger the Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not set, so Render was not redeployed. Add it in Settings → Secrets and variables → Actions."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null
          echo "Render deploy started"
