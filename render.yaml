# Render Blueprint: the dev environment (free plan, test payments).
# Render dashboard → New → Blueprint → pick this repository.
services:
  - type: web
    name: remember-me-api-dev
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install --omit=dev
    startCommand: node src/server.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: remember-me-db-dev
          property: connectionString
      - key: PAYMENT_PROVIDER
        value: sandbox
      - key: FRONTEND_URL
        value: https://ramirkolesnik.github.io/remember-me-web
      - key: CORS_ORIGINS
        value: https://ramirkolesnik.github.io,http://localhost:3000

databases:
  - name: remember-me-db-dev
    plan: free
    databaseName: remember_me
